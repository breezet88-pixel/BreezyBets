# FitLibrary (workout-app/): runs all tests on every push.
# Deploying is done by Vercel itself, which watches this repository (see workout-app/docs/hosting.md).
name: FitLibrary tests

on:
  push:
    branches: [main, ccr-badd2cd7-yp33cp]
    paths:
      - 'workout-app/**'
      - '.github/workflows/fitlibrary-deploy.yml'
  pull_request:
    paths:
      - 'workout-app/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Back end tests (local storage, and Turso + Vercel Blob protocols)
        working-directory: workout-app/backend
        run: npm test
      - name: Front end tests
        working-directory: workout-app/frontend
        run: npm test
      - name: Vercel build step
        working-directory: workout-app
        run: node frontend/write-config.mjs && node --check api/handler.js
