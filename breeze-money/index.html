<title>ApexBucks</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#e6e8eb">
<link rel="icon" type="image/jpeg" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout concept: light grey ledger. A condensed display face for the numbers, white panels, black controls.
   Green is money coming in and red is money going out. Controls and neutral figures are black.
   Header + tabs on top (bottom bar on phones); each tab is a month stepper, a headline figure, then working cards. */
:root{
  --bg:#e6e8eb; --panel:#ffffff; --panel-2:#f3f4f6; --line:#d3d6db; --line-soft:#e4e6ea; --line-strong:#8a9099;
  --text:#14161a; --muted:#555a63; --faint:#5f656e;
  --in:#0f7436; --in-line:#b7dcc4; --out:#bd2a21; --out-line:#efc3be;
  --accent:#1b1e23; --accent-hi:#363a42; --accent-soft:#dfe2e7; --focus:#1f5fbf;
  --ok:#0f7436; --warn:#935300; --warn-line:#e3c58f;
  --f-display:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --f-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.app{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 100px}
.num,.big-num,.stat b{font-family:var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.tnum{font-variant-numeric:tabular-nums}
.lab{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:500}
.muted{color:var(--muted)} .faint{color:var(--faint)} .in{color:var(--in)} .out{color:var(--out)} .ink{color:var(--text)} .red{color:var(--out)} .ok{color:var(--in)} .warn{color:var(--warn)}
a{color:inherit}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:14px}
.brand{display:flex;align-items:center;gap:12px;font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:.06em;text-transform:uppercase;line-height:1}
.brand .mark{width:60px;height:60px;flex:none;border-radius:12px;background:#fff;border:1px solid var(--line);padding:4px;box-sizing:border-box;object-fit:cover;object-position:50% 30%;display:block}
.bname{display:flex;flex-direction:column;gap:5px;text-transform:none;font-size:32px;letter-spacing:.03em}
.bname small{text-transform:uppercase}
.brand small{font:500 12px var(--f-body);letter-spacing:.08em;color:var(--muted)}
.pill{flex:none;display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:4px 11px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.pill.saving::before{background:var(--warn)} .pill.err::before{background:var(--out)}
.pill.local::before{background:var(--warn)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px}
.tabs a{padding:11px 16px;text-decoration:none;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a:hover{color:var(--text)}
.tabs a[aria-current=page]{color:var(--text);border-bottom-color:var(--accent)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* section heads */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.head h1{font-family:var(--f-display);font-size:38px;line-height:1;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.head p{color:var(--muted);margin-top:6px;font-size:14px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper .cur{min-width:150px;text-align:center;font-family:var(--f-display);font-size:21px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.btn{border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;font-size:14px;line-height:1.2;min-height:38px}
.btn:hover{border-color:var(--line-strong)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-hi);border-color:var(--accent-hi)}
.btn.ghost{background:transparent}
.btn.small{padding:5px 10px;min-height:30px;font-size:13px}
.btn.danger{border-color:var(--out);color:var(--out)}
.btn.icon{padding:0;width:38px;display:grid;place-items:center}
.btn[disabled]{opacity:.45;cursor:default}

/* hero */
.hero{display:grid;grid-template-columns:1.5fr 1fr 1fr;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:22px}
.hero>div{padding:18px 0 16px 0;display:flex;flex-direction:column;gap:2px;min-width:0}
.hero>div+div{padding-left:24px;border-left:1px solid var(--line)}
.big-num{font-size:68px;line-height:1;font-weight:600}
.hero .mid{font-family:var(--f-display);font-size:42px;line-height:1.05;font-weight:600;font-variant-numeric:tabular-nums}
.hero .sub{font-size:13px;color:var(--muted)}

/* layout grids */
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
.grid-eq{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0;box-shadow:0 1px 2px rgba(20,22,26,.05)}
.card h2{font-family:var(--f-display);font-size:21px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card h2 small{font:400 12.5px var(--f-body);letter-spacing:0;text-transform:none;color:var(--muted)}
.note{font-size:13px;color:var(--muted);line-height:1.45}
.empty{border:1px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);margin-bottom:4px}

/* stats row */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:18px;overflow:hidden}
.stat{padding:14px 16px;min-width:0}
.stat+.stat{border-left:1px solid var(--line)}
.stat b{display:block;font-size:30px;font-weight:600;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}

/* waterfall */
.wf{display:flex;flex-direction:column}
.wf .r{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-top:1px solid var(--line-soft);align-items:baseline}
.wf .r:first-child{border-top:0}
.wf .r .l{min-width:0} .wf .r .l small{display:block;color:var(--muted);font-size:12.5px}
.wf .r .v{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:500}
.wf .r.tot{border-top:1px solid var(--line-strong);background:var(--panel-2);margin:2px -18px;padding:10px 18px}
.wf .r.tot .l{font-weight:600} .wf .r.tot .v{font-family:var(--f-display);font-size:23px;font-weight:600}
.wf .r.final .v{font-size:27px}
.wf .r .v.in{color:var(--in)} .wf .r .v.out{color:var(--out)} .wf .r .v.ink{color:var(--text)}
.sign-m{font-weight:400}

/* bars */
.bars{display:flex;flex-direction:column;gap:11px}
.bar .t{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:4px;gap:10px}
.bar .t span:last-child{font-variant-numeric:tabular-nums;color:var(--muted)}
.bar .rail{height:7px;background:var(--panel-2);border-radius:4px;overflow:hidden}
.bar .rail i{display:block;height:100%;background:var(--out);border-radius:4px}
.bar .rail i.ink{background:var(--accent)} .bar .rail i.in{background:var(--in)} .bar .rail i.out{background:var(--out)}

/* chart */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px var(--f-body)}
.chart .grid{stroke:var(--line);stroke-width:1} .chart .b-in{fill:var(--in)} .chart .b-out{fill:var(--out)} .chart text.cur{fill:var(--text);font-weight:600}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend i.in{background:var(--in)} .legend i.out{background:var(--out)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

/* forms */
.form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));align-items:end}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.fld input,.fld select,.fld textarea,.cell-in{background:var(--panel-2);border:1px solid var(--line-strong);border-radius:8px;padding:9px 11px;width:100%;min-height:40px;color:var(--text)}
.fld input[type=color],.cell-in[type=color]{padding:3px;min-height:40px;width:48px}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.fld textarea{min-height:96px;resize:vertical}
.fld.wide{grid-column:1/-1}
.form.va-form{grid-template-columns:repeat(3,minmax(0,1fr))}
.form.va-form .fld.span2{grid-column:span 2}
.form .actions{display:flex;gap:8px;grid-column:1/-1;flex-wrap:wrap}
.err{color:var(--out);font-size:13px;grid-column:1/-1}
input[type=date],input[type=time],input[type=month]{color-scheme:light}
::placeholder{color:var(--faint);opacity:1}

/* chips */
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel-2);border-radius:99px;padding:4px 11px;font-size:13px;white-space:nowrap;cursor:default}
button.chip{cursor:pointer;color:var(--text)} button.chip:hover{border-color:var(--line-strong)}
.chip.on{background:var(--accent-soft);border-color:var(--accent)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none;box-shadow:inset 0 0 0 1px rgba(20,22,26,.25)}

/* lists */
.day{font-family:var(--f-display);font-size:16px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:14px 0 6px;font-weight:500;display:flex;justify-content:space-between}
.day:first-child{padding-top:0}
.row{display:grid;grid-template-columns:96px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line-soft)}
.row .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.row .what{min-width:0;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.row .amt{font-variant-numeric:tabular-nums;font-weight:500;text-align:right}
.row .acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.row.flag .what::after{content:attr(data-flag);font-size:12px;color:var(--warn)}
.mrow{display:grid;grid-template-columns:62px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line-soft)}
.mrow:first-child{border-top:0}
.tag{font-size:11.5px;border:1px solid var(--line);border-radius:5px;padding:1px 7px;color:var(--muted)}
table{border-collapse:collapse;width:100%}
th{font-weight:500;text-align:left;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:6px 10px 8px 0}
td{padding:9px 10px 9px 0;border-top:1px solid var(--line-soft);font-variant-numeric:tabular-nums}
th.r,td.r{text-align:right;padding-right:0;padding-left:12px}
.scroll{overflow-x:auto}
tr.cur td{background:var(--panel-2)}
.status{font-size:12px;border-radius:99px;padding:2px 9px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.status.paid{color:var(--in);border-color:var(--in-line)}
.status.soon{color:var(--warn);border-color:var(--warn-line)}

/* setup rows */
.cls-row{display:grid;grid-template-columns:48px minmax(0,1.4fr) minmax(0,1.2fr) 90px 54px auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line-soft)}
.cls-row.head-r{border-top:0;padding:0 0 4px}
.tt-day{display:grid;grid-template-columns:54px minmax(0,1fr);gap:10px;padding:9px 0;border-top:1px solid var(--line-soft);align-items:start}
.tt-day b{font-family:var(--f-display);font-size:18px;letter-spacing:.06em;text-transform:uppercase;font-weight:500;color:var(--muted)}
.catch{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer}
.rec-row{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) 90px 104px 120px 120px 64px auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line-soft)}
.pre-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 96px auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line-soft)}
.sect-gap{margin-top:6px}

/* home tiles */
a.brand{color:inherit;text-decoration:none}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-size:14px;margin-bottom:12px;padding:6px 0}
.back:hover{color:var(--text)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;max-width:1000px}
.tile{position:relative;aspect-ratio:1/1;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;justify-content:space-between;text-decoration:none;color:var(--text);min-width:0;overflow:hidden}
.tile:hover{border-color:var(--accent);background:var(--panel)}
.tile .t-big{font-family:var(--f-display);font-size:clamp(34px,4.6vw,58px);font-weight:600;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.tile .t-sub{font-size:14px;color:var(--muted);line-height:1.45}
.tile .t-sub b{color:var(--text);font-weight:600}
.tile .t-go{position:absolute;top:12px;right:18px;font-size:30px;line-height:1;color:var(--faint)}
.tile:hover .t-go{color:var(--text)}
.tile.income,.tile.out{background:var(--panel)}
.tile.income .t-big{color:var(--in)}
.tile.out .t-big{color:var(--out)}
@media (max-width:720px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{padding:15px;border-radius:16px}.tile .t-sub{font-size:12.5px}.tile .t-go{right:14px;top:10px}}
/* combined gross band */
.combined{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:18px;max-width:1000px}
.combined .cb{padding:14px 0 16px;display:flex;flex-direction:column;gap:3px;min-width:0}
.combined .cb+.cb{padding-left:24px;border-left:1px solid var(--line)}
.combined .big-num{display:block;font-size:56px}
.combined .cb+.cb.wide{grid-column:1/-1;border-left:0;padding-left:0;border-top:1px solid var(--line)}
.combined .cb.wide .big-num{font-size:44px}
.what-if{margin-top:14px;padding-top:14px;border-top:1px solid var(--line-soft)}
.what-if .row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.what-if .row2 .cell-in{flex:1 1 100%;max-width:none!important}
.goal+.goal{margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}
.goal .form{align-items:end}
.combined .sub{font-size:13.5px;color:var(--muted);line-height:1.5}
@media (max-width:720px){.combined .big-num{font-size:38px}.combined .cb+.cb{padding-left:14px}.combined .sub{font-size:12.5px}}
.foot{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:36px;padding-top:18px;border-top:1px solid var(--line)}
.foot .btn{display:inline-flex;align-items:center;gap:8px}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rc-line{display:grid;grid-template-columns:24px minmax(0,1fr) 92px 118px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line-soft)}
.rc-line .cell-in{min-height:36px;padding:6px 8px}
@media (max-width:560px){.rc-line{grid-template-columns:24px minmax(0,1fr) 92px}.rc-line .rc-cat{grid-column:2/-1}}
/* savings tick */
.tick{display:inline-flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;color:var(--muted);padding:6px 2px;font-weight:500}
.tick .box{width:28px;height:28px;border:2px solid var(--line-strong);border-radius:8px;display:grid;place-items:center;flex:none;background:var(--panel)}
.tick:hover .box{border-color:var(--accent)}
.tick.on{color:var(--text)}
.tick.on .box{background:var(--accent);border-color:var(--accent)}
/* voice sheet + fab */
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;align-items:center;gap:9px;background:var(--accent);color:#fff;border:0;border-radius:99px;padding:13px 20px 13px 16px;font-weight:600;cursor:pointer;box-shadow:0 8px 24px rgba(20,22,26,.3)}
.fab:hover{background:var(--accent-hi)}
.fab svg{width:20px;height:20px}
.scrim{position:fixed;inset:0;background:rgba(20,22,26,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:640px;max-height:92%;overflow:auto;padding:20px max(18px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet h2{font-family:var(--f-display);font-size:26px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.mic{display:inline-flex;align-items:center;gap:8px}
.mic.live{background:var(--accent);border-color:var(--accent);color:#fff}
.mic.live::before{content:"";width:9px;height:9px;border-radius:50%;background:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.found{display:flex;flex-direction:column}
.found .it{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:10px 0;border-top:1px solid var(--line-soft);align-items:center}
.found .it small{display:block;color:var(--muted)}
.found .it.bad{color:var(--warn)}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));background:var(--text);color:#fff;border-radius:8px;padding:9px 16px;font-size:14px;font-weight:500;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%}
#toast.show{opacity:1}

@media (max-width:420px){.form.va-form{grid-template-columns:repeat(2,minmax(0,1fr))}.form.va-form .fld.span2{grid-column:1/-1}}
@media (max-width:860px){
  .grid2,.grid-eq{grid-template-columns:minmax(0,1fr)}
  .rec-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} .rec-row .btn{justify-self:start}
}
@media (max-width:720px){
  .app{padding-block:14px 100px}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:35;margin:0;background:var(--panel);border-top:1px solid var(--line);border-bottom:0;
        padding:4px max(6px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));justify-content:space-between;gap:0}
  .tabs a{flex:1;text-align:center;padding:12px 2px;font-size:12.5px;border-bottom:0;margin:0;border-top:2px solid transparent}
  .tabs a[aria-current=page]{border-top-color:var(--accent);border-bottom:0}
  .fab{bottom:calc(16px + env(safe-area-inset-bottom,0px));padding:12px 16px 12px 14px}
  #toast{top:calc(12px + env(safe-area-inset-top,0px))}
  .head h1{font-size:32px}
  .hero{grid-template-columns:1fr 1fr}
  .hero>div:first-child{grid-column:1/-1;border-bottom:1px solid var(--line)}
  .hero>div+div{padding-left:0;border-left:0}
  .hero>div:nth-child(3){padding-left:16px;border-left:1px solid var(--line)}
  .big-num{font-size:60px} .hero .mid{font-size:34px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat:nth-child(3){border-left:0} .stat:nth-child(n+3){border-top:1px solid var(--line)}
  .row{grid-template-columns:72px minmax(0,1fr) auto}
  .row .acts{grid-column:2/-1}

<script>
(function(){
'use strict';

/* =============================================================== helpers */
var pad=function(n){return String(n).padStart(2,'0')};
var ymd=function(y,m,d){return y+'-'+pad(m)+'-'+pad(d)};

var dow=function(s){return toDate(s).getUTCDay()};
var mkOf=function(s){return s.slice(0,7)};
var mkParse=function(mk){return{y:+mk.slice(0,4),m:+mk.slice(5,7)}};
var addMonths=function(mk,n){var p=mkParse(mk);var t=p.y*12+(p.m-1)+n;return Math.floor(t/12)+'-'+pad(t%12+1)};

var lastDay=function(mk){var p=mkParse(mk);return new Date(Date.UTC(p.y,p.m,0)).getUTCDate()};
var periodEnd=function(mk){var c=(S().cutoffs||{})[mk];return c||mk+'-10'};
var periodStart=function(mk){return addDays(periodEnd(addMonths(mk,-1)),1)};

var payMonthOf=function(s){var m=mkOf(s);return s<=periodEnd(m)?m:addMonths(m,1)};
var r2=function(n){return Math.round((n+Number.EPSILON)*100)/100};
var sum=function(a,f){return a.reduce(function(t,x){return t+(f?f(x):x)},0)};

var DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var DOWL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

var fmtDY=function(s){return fmtD(s)+' '+parse(s).y};
var fmtDs=function(s){var p=parse(s);return p.d+' '+MON[p.m-1]};
var monthLabel=function(mk){var p=mkParse(mk);return MONL[p.m-1]+' '+p.y};
var monthShort=function(mk){return MON[mkParse(mk).m-1]};
var todayStr=function(){var d=new Date();return ymd(d.getFullYear(),d.getMonth()+1,d.getDate())};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var Rw=function(n){return R(Math.round(+n||0))};
var R=function(n){n=+n||0;var neg=n<-0.004;var a=Math.abs(n);var int=Math.abs(a-Math.round(a))<0.005;var s=(int?Math.round(a):a).toLocaleString('en-US',int?{}:{minimumFractionDigits:2,maximumFractionDigits:2});return (neg?'−':'')+'R'+s};

var days=function(a,b){return Math.round((toDate(b)-toDate(a))/864e5)};

/* ============================================================ SA calendar */
function easter(y){var a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return ymd(y,mo,da)}
var hCache={};
function holidays(y){
  if(hCache[y])return hCache[y];
  var map={};
  var fixed=[[1,1,"New Year's Day"],[3,21,'Human Rights Day'],[4,27,'Freedom Day'],[5,1,"Workers' Day"],[6,16,'Youth Day'],[8,9,"Women's Day"],[9,24,'Heritage Day'],[12,16,'Day of Reconciliation'],[12,25,'Christmas Day'],[12,26,'Day of Goodwill']];

function holidayName(ds){

}
function adjustPayday(target,label){

    var w=dow(d),h=holidayName(d);
    if(w===0||w===6||h){if(!reason)reason=h?(label+' is '+h):(label+' is a '+(w===6?'Saturday':'Sunday'));d=addDays(d,-1)}else break;
  }

var vaPayday=function(mk){return adjustPayday(mk+'-'+pad(lastDay(mk)),'The last day')};
var bePayday=function(mk){var pd=Math.min(28,Math.max(1,+state.settings.be.payDay||25));return adjustPayday(mk+'-'+pad(pd),'The '+pd+'th')};

/* ================================================================== tax */
/* Tax is never taken from tax tables. It is worked out from your payslip:
   PAYE and UIF rates are the latest payslip's PAYE and UIF divided by its gross pay. */
function slipRates(){
  var ps=S().be.payslips||{},ks=Object.keys(ps).sort().reverse();
  for(var i=0;i<ks.length;i++){
    var p=ps[ks[i]],gross=(+p.basic||0)-(+p.unpaid||0)+(+p.overtime||0);
    if(gross>0&&p.paye!==undefined&&p.paye!==null&&p.paye!=='')return{mk:ks[i],gross:r2(gross),paye:+p.paye||0,uif:+p.uif||0,payeRate:(+p.paye||0)/gross,uifRate:(+p.uif||0)/gross};
  }
  return null;
}
var ownRate=function(v){return v!==''&&v!==null&&v!==undefined&&isFinite(+v)&&+v>=0};
function payeRate(){var o=S().be.payePct;if(ownRate(o))return +o/100;var r=slipRates();return r?r.payeRate:0}
function uifRate(){var o=S().be.uifPct;if(ownRate(o))return +o/100;var r=slipRates();return r?r.uifRate:0}
function vaTaxRate(){var o=S().tax.vaPct;if(ownRate(o))return +o/100;return payeRate()}
function fmtPct(r){return String(Math.round(r*10000)/100)+'%'}

/* ================================================================ state */
function defaultSettings(){return{
  v:2,
  classes:[
    {id:'rosebank-grid',name:'Rosebank Grid',venue:'Rosebank',rate:230,color:'#1f5fbf',active:true},
    {id:'melrose-lift',name:'Melrose Lift Club',venue:'Melrose Arch',rate:350,color:'#6b3fb3',active:true},
    {id:'melrose-hyrox',name:'Melrose Hyrox',venue:'Melrose Arch',rate:230,color:'#c26a00',active:true},
    {id:'melrose-rumble',name:'Melrose Rumble',venue:'Melrose Arch',rate:230,color:'#b0307a',active:true},
    {id:'melrose-shape',name:'Melrose Shape',venue:'Melrose Arch',rate:230,color:'#0c7f8f',active:true}
  ],
  timetable:[],
  be:{basic:0,payDay:25,from:'2026-10',uifPct:'',payePct:'',hourly:'',overtime:[],loan:{monthly:0,balance:0,asOf:''},legacy:{},unpaidDays:{},payslips:{}},
  tax:{vaSetAside:true,vaPct:''},
  recurring:[],
  presets:[
    {id:'p1',label:'Travel',category:'Travel',amount:''},
    {id:'p2',label:'Petrol',category:'Petrol',amount:''},
    {id:'p3',label:'Groceries',category:'Groceries',amount:''},
    {id:'p4',label:'Uber',category:'Transport',amount:''},
    {id:'p5',label:'Eating out',category:'Eating out',amount:''},
    {id:'p6',label:'Airtime and data',category:'Phone',amount:''}
  ],
  extraHolidays:[],
  cutoffs:{},
  leave:[],
  savings:{monthly:0,from:'',months:{},goals:[]},
  taxpot:{months:{}}
}}
var state={settings:defaultSettings(),periods:{},ledger:{}};
var today=todayStr();
var S=function(){return state.settings};
/* The first version used colours made for a dark screen. Swap those for ones that read on light grey, and keep red and green for money. */
var OLD_CLASS_COLORS={'#e3262d':'#1f5fbf','#ededf0':'#6b3fb3','#f0a43a':'#c26a00','#ff7aa8':'#b0307a','#6fb3e0':'#0c7f8f','#8a8a94':'#6b717b','#b5555a':'#8a5a2b','#d96a8e':'#4b5d9e','#59c2b0':'#5b6472','#ffb84d':'#9a7400','#b79cf0':'#4b5d9e'};
var CLASS_PALETTE=['#1f5fbf','#6b3fb3','#c26a00','#b0307a','#0c7f8f','#8a5a2b','#4b5d9e'];
function safeColor(c){
  var m=/^#([0-9a-f]{6})$/i.exec(String(c||''));if(!m)return '#6b717b';
  var rgb=[16,8,0].map(function(sh){return parseInt(m[1],16)>>sh&255});
  var lum=function(a){return a.reduce(function(t,v,i){v/=255;v=v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);return t+v*[.2126,.7152,.0722][i]},0)};
  var k=1;while(k>.3&&lum(rgb.map(function(v){return v*k}))>.3)k-=.05;
  return '#'+rgb.map(function(v){return String(Math.round(v*k).toString(16)).padStart(2,'0')}).join('');
}
function applySettings(d){
  var def=defaultSettings();d=d||{};
  var s=Object.assign(def,d);
  s.be=Object.assign(defaultSettings().be,d.be||{});
  s.be.loan=Object.assign({monthly:0,balance:0,asOf:'',rate:''},(d.be&&d.be.loan)||{});
  s.be.legacy=s.be.legacy||{};s.be.unpaidDays=s.be.unpaidDays||{};s.be.payslips=s.be.payslips||{};if(!Array.isArray(s.be.overtime))s.be.overtime=[];
  s.tax=Object.assign({vaSetAside:true,vaPct:''},d.tax||{});
  ['classes','timetable','recurring','presets','extraHolidays','leave'].forEach(function(k){if(!Array.isArray(s[k]))s[k]=def[k]});
  if(!s.cutoffs||typeof s.cutoffs!=='object')s.cutoffs={};
  s.savings=Object.assign({monthly:0,from:'',months:{}},d.savings||{});if(!s.savings.months)s.savings.months={};
  s.savings.goals=Array.isArray(d.savings&&d.savings.goals)?d.savings.goals.map(function(g){return{id:g.id||uid(),name:g.name||'',target:+g.target||0,saved:+g.saved||0,monthly:g.monthly||''}}):[];
  if(!s.savings.goals.length&&d.savings&&d.savings.goal&&(d.savings.goal.name||+d.savings.goal.target>0)){var og=d.savings.goal;s.savings.goals=[{id:uid(),name:og.name||'',target:+og.target||0,saved:+og.opening||0,monthly:''}]}
  delete s.savings.goal;
  s.taxpot=Object.assign({months:{}},d.taxpot||{});if(!s.taxpot.months)s.taxpot.months={};
  s.classes=s.classes.map(function(c){var n=OLD_CLASS_COLORS[String(c&&c.color||'').toLowerCase()];return n?Object.assign({},c,{color:n}):c});

/* ============================================================ persistence */
var store={db:null,mode:'loading',loaded:{s:false,p:false,l:false},failed:false,status:'loading'};
var dirty=new Set(),inflight=new Set(),flushing=false,flushTimer=0;
var clone=function(o){return JSON.parse(JSON.stringify(o))};
function setStatus(){
  var el=document.getElementById('sync');if(!el)return;
  var t='Saved',c='';
  if(store.mode==='local'){t='On this device';c='local'}
  else if(store.failed){t='Could not save. Retrying';c='err'}
  else if(dirty.size||inflight.size){t='Saving';c='saving'}
  else if(store.mode==='loading'||!(store.loaded.s&&store.loaded.p&&store.loaded.l)){t='Loading your numbers';c='saving'}
  else if(store.slow){t="Can't reach saved data yet";c='err'}
  el.className='pill '+c;el.textContent=t;
}
var dataVer=0;
var REFRESH='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>';
function markDirty(p){dataVer++;dirty.add(p);setStatus();clearTimeout(flushTimer);flushTimer=setTimeout(flush,300)}
function saveLocal(){try{localStorage.setItem('breeze-money',JSON.stringify(state))}catch(e){}}
function loadLocal(){dataVer++;try{var j=JSON.parse(localStorage.getItem('breeze-money')||'null');if(j){applySettings(j.settings);state.periods=j.periods||{};state.ledger=j.ledger||{}}}catch(e){}store.loaded={s:true,p:true,l:true}}
async function writeDoc(p){
  if(!store.db){saveLocal();return}
  var parts=p.split('/'),col=parts[0],id=parts[1],data;
  if(col==='settings')data=state.settings;
  else if(col==='periods')data={sessions:state.periods[id]||[]};
  else data={entries:state.ledger[id]||[]};
  await store.db.doc(p).set(clone(data));
}
async function flush(){
  if(flushing)return;flushing=true;
  try{
    while(dirty.size){
      var p=dirty.values().next().value;dirty.delete(p);inflight.add(p);
      try{await writeDoc(p);store.failed=false}catch(e){store.failed=true;dirty.add(p);inflight.delete(p);flushing=false;setStatus();clearTimeout(flushTimer);flushTimer=setTimeout(flush,4000);return}
      inflight.delete(p);
    }
  }finally{flushing=false}
  setStatus();
}
var busy=function(p){return dirty.has(p)||inflight.has(p)};
async function refreshData(){
  if(ui.refreshing)return;
  ui.refreshing=true;render();
  try{
    if(store.db){
      clearTimeout(flushTimer);await flush();
      var r=await Promise.all([store.db.doc('settings/main').get(),store.db.collection('periods').get(),store.db.collection('ledger').get()]);
      if(!busy('settings/main')&&r[0].exists)applySettings(clone(r[0].data()));
      var np={};r[1].docs.forEach(function(d){np[d.id]=clone(d.data()).sessions||[]});
      Object.keys(state.periods).forEach(function(k){if(busy('periods/'+k))np[k]=state.periods[k]});
      state.periods=np;
      var nl={};r[2].docs.forEach(function(d){nl[d.id]=clone(d.data()).entries||[]});
      Object.keys(state.ledger).forEach(function(k){if(busy('ledger/'+k))nl[k]=state.ledger[k]});
      state.ledger=nl;
    }else{loadLocal()}
    dataVer++;ui.lastRefresh=new Date();toast('Refreshed. Everything is up to date');
    if(swReg){
      try{await swReg.update()}catch(e){}
      await new Promise(function(res){var w=swReg.installing;if(!w)return res();w.addEventListener('statechange',function(){if(w.state==='installed'||w.state==='redundant')res()});setTimeout(res,6000)});
      if(swReg.waiting){ui.swUpdating=true;toast('New version found. Updating');swReg.waiting.postMessage('skip')}
    }
  }catch(e){toast('Could not refresh. Check your connection and try again')}
  ui.refreshing=false;render();
}
async function initStore(){
  var db=null;
  try{db=await (window.claude&&window.claude.use?window.claude.use('db'):null)}catch(e){db=null}
  if(!db){store.mode='local';loadLocal();ui.lastRefresh=new Date();setStatus();render();return}
  store.db=db;store.mode='cloud';
  var t=setTimeout(function(){store.slow=true;setStatus()},10000);
  var done=function(k){store.loaded[k]=true;if(store.loaded.s&&store.loaded.p&&store.loaded.l){clearTimeout(t);store.slow=false;if(!ui.lastRefresh)ui.lastRefresh=new Date()}setStatus();render()};
  var onErr=function(){store.failed=true;setStatus()};
  db.doc('settings/main').onSnapshot(function(snap){
    if(!busy('settings/main')&&snap.exists)applySettings(clone(snap.data()));
    dataVer++;done('s');
  },onErr);
  db.collection('periods').onSnapshot(function(snap){
    var seen={};
    snap.docs.forEach(function(d){seen[d.id]=1;if(!busy('periods/'+d.id)){state.periods[d.id]=(clone(d.data()).sessions||[])}});
    Object.keys(state.periods).forEach(function(k){if(!seen[k]&&!busy('periods/'+k)&&!snap.metadata.fromCache)delete state.periods[k]});
    dataVer++;done('p');
  },onErr);
  db.collection('ledger').onSnapshot(function(snap){
    var seen={};
    snap.docs.forEach(function(d){seen[d.id]=1;if(!busy('ledger/'+d.id)){state.ledger[d.id]=(clone(d.data()).entries||[])}});
    Object.keys(state.ledger).forEach(function(k){if(!seen[k]&&!busy('ledger/'+k)&&!snap.metadata.fromCache)delete state.ledger[k]});
    dataVer++;done('l');
  },onErr);
}

/* ============================================================== queries */
var classById=function(id){return S().classes.filter(function(c){return c.id===id})[0]};
function clsOf(s){var c=classById(s.classId);return c||{id:s.classId,name:s.label||'Class',venue:'',color:'#6b717b',rate:s.rate,active:false}}
var cmpSession=function(a,b){return a.date<b.date?-1:a.date>b.date?1:mins(a.start)-mins(b.start)};
var idx={key:'',map:{}};
function sessionIndex(){
  var key=dataVer+'|'+JSON.stringify(S().cutoffs||{});
  if(idx.key!==key){var m={};Object.keys(state.periods).forEach(function(k){state.periods[k].forEach(function(x){var pm=payMonthOf(x.date);(m[pm]=m[pm]||[]).push(x)})});idx={key:key,map:m}}
  return idx.map;
}
var sessionsFor=function(mk){return (sessionIndex()[mk]||[]).slice().sort(cmpSession)};
/* A class counts unless it is cancelled. Cancelled classes stay in the list, struck through, but are never counted. */
var liveSessions=function(mk){return sessionsFor(mk).filter(function(s){return s.status!=='cancelled'})};
var leaveOn=function(ds){return (S().leave||[]).filter(function(l){return ds>=l.from&&ds<=l.to})[0]||null};
var ledgerFor=function(mk){return state.ledger[mk]||[]};
/* Tax lines from before payslip figures start were estimates, so they are never counted. */
var isEstimate=function(e){return e.estimate===true||(e.kind!=='income'&&catKey(e.category)==='tax'&&mkOf(e.date)<S().be.from)};
var counted=function(e){return !isEstimate(e)};
function addSession(s){var k=payMonthOf(s.date);(state.periods[k]=state.periods[k]||[]).push(s);markDirty('periods/'+k)}
function findSession(id){for(var k in state.periods){var i=state.periods[k].findIndex(function(s){return s.id===id});if(i>=0)return{k:k,i:i,s:state.periods[k][i]}}return null}
function removeSession(id){var f=findSession(id);if(!f)return;state.periods[f.k].splice(f.i,1);markDirty('periods/'+f.k)}
function addEntry(e){var k=mkOf(e.date);(state.ledger[k]=state.ledger[k]||[]).push(e);markDirty('ledger/'+k)}
function findEntry(id){for(var k in state.ledger){var i=state.ledger[k].findIndex(function(s){return s.id===id});if(i>=0)return{k:k,i:i,e:state.ledger[k][i]}}return null}
function removeEntry(id){var f=findEntry(id);if(!f)return;state.ledger[f.k].splice(f.i,1);markDirty('ledger/'+f.k)}

/* B-Active, using the payslip as the base */
function loanFor(mk){
  var L=S().be.loan;
  if(!L||!(+L.monthly)||!L.asOf||mk<=L.asOf)return{pay:0,after:null};
  var n=monthsBetween(L.asOf,mk);var remaining=r2(L.balance-L.monthly*(n-1));
  var pay=Math.max(0,Math.min(+L.monthly,remaining));
  return{pay:r2(pay),after:r2(Math.max(0,remaining-pay))};
}
/* What if you paid the loan off faster? Interest is only used when you type a rate in Setup. */
function loanPlan(extra){
  var L=S().be.loan,B=+L.balance||0,P=(+L.monthly||0)+(+extra||0),r=(+L.rate||0)/1200;
  if(!(B>0)||!(P>0))return null;
  var n=0,bal=B,paid=0;
  while(bal>0.005&&n<600){var i=bal*r;if(P<=i+0.005)return{never:true};var pay=Math.min(P,bal+i);bal=bal+i-pay;paid+=pay;n++}
  return{months:n,interest:r2(Math.max(0,paid-B))};
}
function loanWhatText(){
  var L=S().be.loan,x=+ui.x.loan||0,base=loanPlan(0);
  if(!base)return '';

/* ---------- weekly allowances */
function mondayOf(ds){return addDays(ds,-((dow(ds)+6)%7))}
function weekData(monday){
  var end=addDays(monday,6),mk=mkOf(monday);
  var act=function(r){return mk>=r.from&&(!r.until||mk<=r.until)};
  var monthly=S().recurring.filter(function(r){return r.per!=='week'&&act(r)});
  var recs=S().recurring.filter(function(r){return r.per==='week'&&act(r)}).map(function(r){return Object.assign({},r,{amount:+r.amount||0,actual:0})});
  var catchAll=recs.filter(function(r){return r.catchAll})[0];
  var ks=[mkOf(monday),mkOf(end)].filter(function(v,i,a){return a.indexOf(v)===i});
  var entries=[];
  ks.forEach(function(k){(state.ledger[k]||[]).forEach(function(e){if(e.kind!=='income'&&e.date>=monday&&e.date<=end&&counted(e))entries.push(e)})});
  entries.sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0});
  var counts={};
  entries.forEach(function(e){
    var k=catKey(e.category);
    if(monthly.some(function(r){return catKey(r.category)===k}))return;
    var m=recs.filter(function(r){return !r.catchAll&&catKey(r.category)===k})[0]||catchAll;
    if(m){m.actual+=+e.amount||0;counts[e.id]=m.label}
  });
  var budget=sum(recs,function(r){return r.amount}),spent=sum(recs,function(r){return r.actual});
  return{monday:monday,end:end,recs:recs,budget:budget,spent:spent,left:r2(budget-spent),entries:entries,counts:counts};
}

/* ---------- money */
function allCategories(){
  var set={};['Travel','Petrol','Groceries','Transport','Eating out','Phone','Weekly spending','Loans & debt','Tax','Car','Bills','Savings','Clothes','Health','Other'].forEach(function(c){set[c]=1});
  S().presets.forEach(function(p){if(p.category)set[p.category]=1});
  S().recurring.forEach(function(p){if(p.category)set[p.category]=1});
  Object.keys(state.ledger).forEach(function(k){state.ledger[k].forEach(function(e){if(e.category)set[e.category]=1})});
  return Object.keys(set).sort();
}
function viewMoney(){
  var mk=ui.moneyMonth,s=summary(mk),f=ui.money;
  var led=ledgerFor(mk).slice().sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0});
  var rec=s.alloc.recs;
  var inc=sum(ledgerFor(mk).filter(function(e){return e.kind==='income'&&counted(e)}),function(e){return +e.amount||0});

  var rows=led.map(function(e){
    var arm=ui.armed==='e:'+e.id;

  var rentCard='<div class="card"><h2>Rent you\u2019re considering <small>Not a bill yet</small></h2>'+
    '<p class="note">See what a monthly rent would leave you, without changing your real numbers. A common guideline is to keep rent under about a third of take-home. When you sign a lease, add it for real with the Rent or bond button in Setup.</p>'+
    '<div class="what-if" style="border-top:0;padding-top:4px"><label class="lab" for="rent-try">Monthly rent (R)</label><div class="row2"><input id="rent-try" class="cell-in" type="number" inputmode="decimal" min="0" step="any" data-b="x.rent" value="'+esc(ui.x.rent)+'" placeholder="6000" style="max-width:190px">'+[5000,6000,7000].map(function(v){return '<button class="chip" type="button" data-act="x-set" data-k="rent" data-v="'+v+'">'+R(v)+'</button>'}).join('')+'</div><p class="note" id="rent-what" style="margin-top:8px">'+esc(rentWhatText())+'</p></div></div>';
  return head+stats+'<div class="grid2"><div class="stack">'+form+rentCard+'</div><div class="stack">'+list+'</div></div>';

  return head+'<div class="grid2"><div class="stack">'+cls+tt+rec+pre+'</div><div class="stack">'+install+be+leaveCard+cutCard+hol+data+'</div></div>';

function resolve(root,path){
  var parts=path.split('.'),o=root;
  for(var i=0;i<parts.length-1;i++){
    var seg=parts[i],ix=seg.indexOf('#');
    if(ix>=0){var arr=o[seg.slice(0,ix)],id=seg.slice(ix+1);o=arr.filter(function(x){return x.id===id})[0];if(!o)return null}
    else{if(o[seg]==null)o[seg]={};o=o[seg]}
  }
  return{o:o,k:parts[parts.length-1]};
}

function buildFill(past){

function parseBackup(text){
  try{
    var j=JSON.parse(String(text||'').trim());
    if(!j||typeof j!=='object'||!j.settings||typeof j.periods!=='object'||typeof j.ledger!=='object')throw new Error('shape');
    var nS=0,nE=0,dates=[];
    Object.keys(j.periods).forEach(function(k){(j.periods[k]||[]).forEach(function(x){nS++;dates.push(x.date)})});
    Object.keys(j.ledger).forEach(function(k){nE+=(j.ledger[k]||[]).length});
    dates.sort();ui.imp={data:j,nS:nS,nE:nE,first:dates[0],last:dates[dates.length-1]};
    ui.paste.open=false;ui.paste.text='';render();return true;
  }catch(e){toast('That is not an ApexBucks backup. Copy it again and retry');return false}
}

function webSpeechShim(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return null;
  var rec=null,pl=[],fl=[],sl=[];
  return{
    start:function(){return new Promise(function(res,rej){
      try{
        rec=new SR();rec.lang='en-ZA';rec.interimResults=true;rec.continuous=true;
        rec.onresult=function(e){var fin='',par='';for(var i=e.resultIndex;i<e.results.length;i++){var r=e.results[i];if(r.isFinal)fin+=r[0].transcript;else par+=r[0].transcript}if(par)pl.forEach(function(f){f({text:par})});if(fin)fl.forEach(function(f){f({text:fin})})};
        rec.onstart=function(){sl.forEach(function(f){f({state:'listening'})});res()};
        rec.onerror=function(e){rej({code:e.error==='not-allowed'?'not_granted':'unavailable'})};
        rec.onend=function(){sl.forEach(function(f){f({state:'idle',reason:'stopped'})})};
        rec.start();
      }catch(err){rej({code:'unavailable'})}
    })},
    stop:function(){return new Promise(function(res){if(rec){try{rec.stop()}catch(e){}}res()})},
    onPartial:function(f){pl.push(f)},onFinal:function(f){fl.push(f)},onState:function(f){sl.push(f)}
  };
}

    }

}

        '\nKnown expense categories: '+allCategories().join(', ')+'.\n\nReturn ONLY a JSON array. Each item is one of:\n{"type":"class","date":"YYYY-MM-DD","classId":"<id from the list>","start":"HH:MM","end":"HH:MM or null","rate":number or null,"weeks":1}\n{"type":"expense"|"income","date":"YYYY-MM-DD","label":"short text","category":"one of the known categories or a short new one","amount":number}\n{"type":"overtime","date":"YYYY-MM-DD","hours":number,"multiplier":number or null}\nRules: an overtime item is extra paid hours worked for B-Active, such as a Sunday shift; the multiplier is 2 for double pay. Times are 24 hour (5pm is 17:00). Resolve words like tomorrow, Friday or last Monday to a real date from today (a bare weekday means its next occurrence, or today). With no date, use today. "weeks" is how many weekly repeats, 1 when not repeated. Class length is 45 minutes unless told. Amounts are in rand. One item per class and one per expense. Skip anything that is not a class, expense or income.\n\nNote:\n"""'+text.slice(0,2000)+'"""';
      var out=await caps.sample.json(prompt,{modelTier:'quick',cache:false});
      if(Array.isArray(out)){items=out;v.via='Read by Claude. Check each line before adding.'}
    }catch(e){items=null}
  }
  if(!items){items=localParse(text);v.via='Read with the simple reader. Check each line before adding.'}

function normalise(list){
  var out=[];
  list.slice(0,40).forEach(function(x){
    if(!x||typeof x!=='object')return;
    var date=/^\d{4}-\d{2}-\d{2}$/.test(x.date||'')?x.date:today;
    if(x.type==='class'){
      var c=classById(x.classId);var it={type:'class',date:date,classId:x.classId,start:/^\d{1,2}:\d{2}$/.test(x.start||'')?tstr(mins(x.start)):'',end:'',rate:0,weeks:Math.max(1,Math.min(12,Math.round(+x.weeks||1)))};
      if(!c){it.problem='Could not match a class. Remove it and add it from the Virgin Active tab.'}
      else{it.rate=x.rate!=null&&+x.rate>=0?+x.rate:c.rate;if(!it.start)it.problem='No start time heard.';else it.end=/^\d{1,2}:\d{2}$/.test(x.end||'')&&mins(x.end)>mins(it.start)?tstr(mins(x.end)):tstr(mins(it.start)+45)}
      out.push(it);
    }else if(x.type==='overtime'){
      var hrs=+x.hours,mu=+x.multiplier>0?+x.multiplier:2;
      var it3={type:'overtime',date:date,hours:hrs,mult:mu,rate:hourlyRate(),paidIn:otPaidIn(date)};
      if(!(hrs>0))it3.problem='No hours heard.';else if(!(it3.rate>0))it3.problem='Set your basic salary or hourly rate in Setup first.';
      out.push(it3);
    }else if(x.type==='expense'||x.type==='income'){
      var amt=+x.amount;var it2={type:x.type,date:date,label:String(x.label||'').slice(0,60)||'Expense',category:String(x.category||'').slice(0,30)||(x.type==='income'?'Extra income':'Other'),amount:amt};
      if(!(amt>0))it2.problem='No amount heard.';out.push(it2);
    }
  });
  return out;
}
/* simple reader used when Claude is not available */
function localParse(text){
  var out=[];
  var parts=[];
  text.split(/[;\n]+|\.(?!\d)|\bthen\b|\band also\b/i).forEach(function(sn){
    var l=sn.toLowerCase();
    if(/\bovertime\b|\bextra shift\b|\bsunday shift\b/.test(l)||(/\bshift\b/.test(l)&&/\bb-?active\b/.test(l)))parts.push(sn);
    else sn.split(/,(?!\d)/).forEach(function(x){parts.push(x)});
  });
  parts.forEach(function(p){
    p=p.trim();if(!p)return;var low=p.toLowerCase();
    var date=today;
    if(/\btomorrow\b/.test(low))date=addDays(today,1);else if(/\byesterday\b/.test(low))date=addDays(today,-1);
    else{for(var i=0;i<7;i++){var nm=DOWL[i].toLowerCase();if(new RegExp('\\b'+nm+'\\b|\\b'+nm.slice(0,3)+'\\b').test(low)){var diff=(i-dow(today)+7)%7;if(/\blast\b/.test(low))diff=diff-7||-7;date=addDays(today,diff);break}}}
    var dm=low.match(/\b(\d{1,2})(?:st|nd|rd|th)?\s*(?:of\s+)?(jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|jun(?:e)?|jul(?:y)?|aug(?:ust)?|sep(?:t(?:ember)?)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)\b/);
    if(dm){var mi=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'].indexOf(dm[2].slice(0,3));var yy=+today.slice(0,4),cand=ymd(yy,mi+1,+dm[1]);if(cand<addDays(today,-60))cand=ymd(yy+1,mi+1,+dm[1]);date=cand}
    var oh=low.match(/(\d+(?:\.\d+)?)\s*(?:hours?|hrs?|h)\b/);
    if(oh&&(/\bovertime\b|\bextra shift\b|\bsunday shift\b/.test(low)||(/\bshift\b/.test(low)&&/\bb-?active\b/.test(low)))){
      out.push({type:'overtime',date:date,hours:+oh[1],multiplier:/\bdouble\b|\btwice\b|\b2\s*x\b/.test(low)?2:(/time and a half|1\.5/.test(low)?1.5:null)});
      return;
    }
    var cls=null;
    S().classes.filter(function(c){return c.active}).forEach(function(c){
      var words=c.name.toLowerCase().split(/\s+/);var key=words.filter(function(w){return ['rosebank','melrose','arch','club'].indexOf(w)<0}).join(' ');
      if(key&&low.indexOf(key)>=0){var venueHit=words.some(function(w){return ['rosebank','melrose'].indexOf(w)>=0&&low.indexOf(w)>=0});if(!cls||venueHit)cls=c}
    });
    var times=[];var re=/(\d{1,2})(?::(\d{2}))?\s*(am|pm|a\.m\.|p\.m\.)?/gi,m;
    var tl=low.replace(/r\s?\d[\d\s,]*(\.\d+)?/g,' ').replace(/\b\d+\s*(weeks?|classes|sessions?)\b/g,' ');
    while((m=re.exec(tl))){
      if(m[2]==null&&m[3]==null)continue;var hr=+m[1],mi=+(m[2]||0);var ap=(m[3]||'').replace(/\./g,'');
      if(hr>23||mi>59)continue;if(ap==='pm'&&hr<12)hr+=12;if(ap==='am'&&hr===12)hr=0;times.push(pad(hr)+':'+pad(mi));
    }
    if(!times.length){var m2=/\bat\s+(\d{1,2})\b/.exec(tl);if(m2){var h2=+m2[1];if(h2<=4)h2+=12;times.push(pad(h2)+':00')}}
    var wk=/every week (?:for )?(\d+)/.exec(low)||/(\d+)\s*weeks?/.exec(low);var weeks=wk?+wk[1]:1;
    if(cls){
      if(!times.length)times=[''];
      times.forEach(function(t){out.push({type:'class',date:date,classId:cls.id,start:t,end:null,rate:null,weeks:weeks})});
      return;
    }
    var am=/(?:r\s?)(\d[\d\s,]*(?:\.\d+)?)/i.exec(p)||/(\d[\d\s,]*(?:\.\d+)?)\s*(?:rand|bucks)/i.exec(p)||/(?:spent|paid|cost|for)\s+(\d[\d\s,]*(?:\.\d+)?)/i.exec(p);
    if(am){
      var amount=+am[1].replace(/[\s,]/g,'');
      var income=/\b(received|got paid|earned|income|paid me|cover class)\b/.test(low);
      var label=p.replace(am[0],' ').replace(/\b(i|spent|paid|on|for|got|received|today|yesterday|tomorrow)\b/gi,' ').replace(/\s+/g,' ').trim()||'Expense';
      var cat='Other',map=[[/petrol|fuel/,'Petrol'],[/uber|bolt|taxi|transport/,'Transport'],[/grocer|checkers|woolies|shoprite|pick n pay|food shop/,'Food'],[/airtime|data|cell c|phone/,'Phone'],[/lunch|dinner|coffee|restaurant|takeaway|eating/,'Food'],[/travel/,'Travel'],[/cloth|shoes/,'Clothes'],[/doctor|pharmacy|medic/,'Health']];
      map.forEach(function(x){if(cat==='Other'&&x[0].test(low))cat=x[1]});
      out.push({type:income?'income':'expense',date:date,label:label.charAt(0).toUpperCase()+label.slice(1),category:income?'Extra income':cat,amount:amount});
    }
  });
  return out;
}
function commitVoice(){
  var v=ui.voice,nC=0,nE=0,nO=0;
  v.items.filter(function(i){return !i.problem}).forEach(function(it){
    if(it.type==='class'){
      var c=classById(it.classId);
      for(var w=0;w<it.weeks;w++){addSession({id:uid(),date:addDays(it.date,7*w),classId:it.classId,label:c.name,start:it.start,end:it.end,rate:it.rate});nC++}
    }else if(it.type==='overtime'){
      S().be.overtime.push({id:uid(),date:it.date,hours:it.hours,rate:r2(it.rate),mult:it.mult,paidIn:it.paidIn,note:''});markDirty('settings/main');nO++;
    }else{addEntry({id:uid(),date:it.date,kind:it.type,label:it.label,category:it.category,amount:it.amount});nE++}
  });
  v.open=false;v.items=null;v.text='';
  toast('Added '+[nC?nC+' class'+(nC===1?'':'es'):'',nE?nE+' money entr'+(nE===1?'y':'ies'):'',nO?nO+' overtime shift'+(nO===1?'':'s'):''].filter(Boolean).join(' and '));
  render();
}

/* ================================================================ boot */
(async function boot(){
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();installEvt=e;render()});
  window.addEventListener('appinstalled',function(){installEvt=null;toast('ApexBucks installed');render()});
  window.addEventListener('pagehide',function(){if(!store.db&&dirty.size)saveLocal()});
  route();render();
  initStore();
  try{caps.dl=await window.claude.use('downloads')}catch(e){}
  try{caps.sample=await window.claude.use('sample')}catch(e){}
  var d=null;
  try{d=await window.claude.use('dictation')}catch(e){}
  if(!d)d=webSpeechShim();
  if(d){
    caps.dict=d;
    d.onPartial(function(x){ui.voice.partial=x.text});
    d.onFinal(function(x){appendText(x.text)});
    d.onState(function(x){ui.voice.listening=(x.state==='listening'||x.state==='starting');render()});
    render();
  }
  if(HOSTED)setupHosted();
})();
})();
</script>
