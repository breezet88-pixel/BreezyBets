# Fly.io hosting for the API. See ../docs/hosting.md.
# "app" must be unique across Fly: change it if the name is taken.
app = "fitlibrary-api"
primary_region = "jnb"            # Johannesburg

[[mounts]]
  source = "fitlibrary_data"      # the disk that holds the database and pictures
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
