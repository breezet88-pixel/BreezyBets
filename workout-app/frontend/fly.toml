# Fly.io hosting for the website. See ../docs/hosting.md.
app = "fitlibrary-web"
primary_region = "jnb"

[env]
  # Address of your API (the "app" name in backend/fly.toml). Change if you renamed it or use your own domain.
  API_URL = "https://fitlibrary-api.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
